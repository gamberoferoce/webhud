<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Universal HUD Button</title>
  <style>
    /* --- STILE BASE: PC Desktop e Smartphone --- */
    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #hud-container {
      text-align: center;
    }

    /* Il bottone mostra l'ultima microgesture */
    .btn-toggle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 8px solid #333;
      background-color: #222;
      color: #888;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.04em;
      cursor: default;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .btn-toggle.state-forward {
      border-color: #ff4444;
      background-color: #330a0a;
      color: #ff4444;
      box-shadow: 0 0 30px #ff4444;
    }

    .btn-toggle.state-right {
      border-color: #ffd84a;
      background-color: #332800;
      color: #ffd84a;
      box-shadow: 0 0 30px #ffd84a;
    }

    .btn-toggle.state-backward {
      border-color: #00ff88;
      background-color: #003311;
      color: #00ff88;
      box-shadow: 0 0 30px #00ff88;
    }

    .btn-toggle.state-left {
      border-color: #4da3ff;
      background-color: #001833;
      color: #4da3ff;
      box-shadow: 0 0 30px #4da3ff;
    }

    .btn-toggle.state-tap {
      border-color: #c56bff;
      background-color: #240833;
      color: #c56bff;
      box-shadow: 0 0 30px #c56bff;
    }

    #quest-xr-btn {
      margin-top: 30px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none; /* Visibile solo se rileva supporto WebXR (Quest) */
    }

    /* --- STILE SPECIFICO: Meta Ray-Ban Display (600x600) --- */
    @media (max-width: 600px) and (max-height: 600px) and (aspect-ratio: 1/1) {
      body {
        background-color: #000000; /* Nero assoluto = Trasparente sulle lenti */
      }
      .btn-toggle {
        width: 300px; /* Più grande e centrato per l'HUD degli occhiali */
        height: 300px;
        font-size: 28px;
      }
      #quest-xr-btn {
        display: none !important; /* Inutile sugli occhiali */
      }
    }
  </style>
</head>
<body>

  <div id="hud-container">
    <button id="toggle-button" class="btn-toggle" type="button">—</button>
    <p id="debug-text">Forward rosso, right giallo, backward verde, left blu, thumb tap viola</p>
  </div>

  <!-- Pulsante di attivazione AR (Appare solo su Meta Quest) -->
  <button id="quest-xr-btn">ENTRA IN MODALITÀ QUEST HUD (AR)</button>

  <script>
    const toggleButton = document.getElementById('toggle-button');
    const debugText = document.getElementById('debug-text');
    const xrButton = document.getElementById('quest-xr-btn');

    const LAYER_SIZE = 512;

    let gestoAttuale = null;
    let gestoTenuto = null;
    let quest_xr_session = null;
    let layerError = null;

    let gl = null;
    let xrGlBinding = null;
    let quadLayer = null;
    let framebuffer = null;
    let buttonTexture = null;
    let quadProgram = null;
    let quadVao = null;
    let buttonCanvas = null;
    let buttonCtx = null;
    let textureDirty = false;

    const GESTI = {
      forward:  { label: 'FORWARD',  color: '#ff4444', fill: 'rgba(51, 10, 10, 0.88)' },
      right:    { label: 'RIGHT',    color: '#ffd84a', fill: 'rgba(51, 40, 0, 0.88)' },
      backward: { label: 'BACKWARD', color: '#00ff88', fill: 'rgba(0, 51, 17, 0.88)' },
      left:     { label: 'LEFT',     color: '#4da3ff', fill: 'rgba(0, 24, 51, 0.88)' },
      tap:      { label: 'THUMB TAP', color: '#c56bff', fill: 'rgba(36, 8, 51, 0.88)' }
    };

    // Occhiali: le direzioni della Neural Band arrivano come frecce.
    // Il thumb tap non ha un tasto suo: sugli occhiali la pagina non lo riceve.
    const TASTI = {
      ArrowUp: 'forward',
      ArrowRight: 'right',
      ArrowDown: 'backward',
      ArrowLeft: 'left'
    };

    // oculus-hand: 5 sinistra, 6 destra, 7 swipe-forward, 8 indietro, 9 thumb tap.
    const PULSANTI_QUEST = {
      5: 'left',
      6: 'right',
      7: 'forward',
      8: 'backward',
      9: 'tap'
    };

    function impostaGesto(id) {
      const gesto = GESTI[id];
      if (!gesto) return;
      gestoAttuale = id;
      toggleButton.className = 'btn-toggle state-' + id;
      toggleButton.textContent = gesto.label;
      debugText.textContent = gesto.label;
      if (quadLayer) {
        drawButtonCanvas();
        textureDirty = true;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const id = TASTI[e.key];
      if (!id) return;
      e.preventDefault();
      impostaGesto(id);
    });

    function drawButtonCanvas() {
      const gesto = gestoAttuale ? GESTI[gestoAttuale] : null;
      const label = gesto ? gesto.label : '—';
      const ctx = buttonCtx;
      ctx.clearRect(0, 0, LAYER_SIZE, LAYER_SIZE);
      ctx.beginPath();
      ctx.arc(256, 256, 200, 0, Math.PI * 2);
      ctx.fillStyle = gesto ? gesto.fill : 'rgba(34, 34, 34, 0.88)';
      ctx.fill();
      ctx.lineWidth = 16;
      ctx.strokeStyle = gesto ? gesto.color : '#666666';
      ctx.stroke();
      ctx.fillStyle = gesto ? gesto.color : '#888888';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let size = 64;
      ctx.font = 'bold ' + size + 'px sans-serif';
      while (size > 28 && ctx.measureText(label).width > 320) {
        size -= 4;
        ctx.font = 'bold ' + size + 'px sans-serif';
      }
      ctx.fillText(label, 256, 256);
    }

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader) || 'Shader non compilato');
      }
      return shader;
    }

    function setupQuadLayer(session) {
      buttonCanvas = document.createElement('canvas');
      buttonCanvas.width = LAYER_SIZE;
      buttonCanvas.height = LAYER_SIZE;
      buttonCtx = buttonCanvas.getContext('2d');

      const glCanvas = document.createElement('canvas');
      gl = glCanvas.getContext('webgl2', { xrCompatible: true, alpha: true });
      if (!gl) {
        throw new Error('WebGL2 non disponibile');
      }

      const vertex = compileShader(gl.VERTEX_SHADER, `#version 300 es
        layout(location = 0) in vec2 aPos;
        out vec2 vUv;
        void main() {
          vUv = aPos * 0.5 + 0.5;
          gl_Position = vec4(aPos, 0.0, 1.0);
        }`);
      const fragment = compileShader(gl.FRAGMENT_SHADER, `#version 300 es
        precision mediump float;
        uniform sampler2D uTex;
        in vec2 vUv;
        out vec4 outColor;
        void main() {
          outColor = texture(uTex, vUv);
        }`);
      quadProgram = gl.createProgram();
      gl.attachShader(quadProgram, vertex);
      gl.attachShader(quadProgram, fragment);
      gl.linkProgram(quadProgram);
      if (!gl.getProgramParameter(quadProgram, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(quadProgram) || 'Programma WebGL non linkato');
      }

      quadVao = gl.createVertexArray();
      gl.bindVertexArray(quadVao);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
        -1, -1,
        3, -1,
        -1, 3
      ]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      buttonTexture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, buttonTexture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      framebuffer = gl.createFramebuffer();

      return gl.makeXRCompatible().then(() => {
        xrGlBinding = new XRWebGLBinding(session, gl);
        return session.requestReferenceSpace('viewer');
      }).then((viewerSpace) => {
        quadLayer = xrGlBinding.createQuadLayer({
          space: viewerSpace,
          viewPixelWidth: LAYER_SIZE,
          viewPixelHeight: LAYER_SIZE,
          width: 0.3,
          height: 0.3,
          transform: new XRRigidTransform({ x: 0, y: 0, z: -1 }),
          colorFormat: gl.RGBA,
          clearOnAccess: false
        });
        session.updateRenderState({ layers: [quadLayer] });
        drawButtonCanvas();
        textureDirty = true;
      });
    }

    function paintQuad(frame) {
      const subImage = xrGlBinding.getSubImage(quadLayer, frame);
      gl.bindTexture(gl.TEXTURE_2D, buttonTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buttonCanvas);

      gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.framebufferTexture2D(
        gl.FRAMEBUFFER,
        gl.COLOR_ATTACHMENT0,
        gl.TEXTURE_2D,
        subImage.colorTexture,
        0
      );
      const viewport = subImage.viewport;
      gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
      gl.disable(gl.BLEND);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.SCISSOR_TEST);
      gl.useProgram(quadProgram);
      gl.bindVertexArray(quadVao);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, buttonTexture);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      textureDirty = false;
    }

    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (supported) {
          xrButton.style.display = 'block';
        }
      });
    }

    xrButton.addEventListener('click', () => {
      if (quest_xr_session || !navigator.xr) return;
      navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['layers'],
        optionalFeatures: ['hand-tracking']
      }).then(onXRSessionStarted).catch((err) => {
        debugText.innerText = 'Sessione Quest non avviata: ' + (err && err.message ? err.message : err);
      });
    });

    function onXRSessionStarted(session) {
      quest_xr_session = session;
      layerError = null;
      session.addEventListener('end', onXRSessionEnded);
      setupQuadLayer(session).then(() => {
        xrButton.style.display = 'none';
        debugText.innerText = 'HUD sul quad layer. Ogni microgesture cambia scritta e colore.';
        session.requestAnimationFrame(onXRFrame);
      }).catch((err) => {
        layerError = 'Layer Quest non avviato: ' + (err && err.message ? err.message : err);
        debugText.innerText = layerError;
        session.end().catch(() => {});
      });
    }

    function onXRSessionEnded() {
      quest_xr_session = null;
      quadLayer = null;
      textureDirty = false;
      gestoTenuto = null;
      xrButton.style.display = 'block';
      debugText.innerText = layerError || 'Sessione Quest chiusa. Puoi rientrare.';
      layerError = null;
    }

    function onXRFrame(time, frame) {
      const session = frame.session;
      if (session !== quest_xr_session) return;
      session.requestAnimationFrame(onXRFrame);

      const premuti = [];
      for (const inputSource of session.inputSources) {
        if (!inputSource.hand || !inputSource.gamepad) continue;
        const buttons = inputSource.gamepad.buttons;
        for (const index in PULSANTI_QUEST) {
          const button = buttons[index];
          if (button && button.pressed) premuti.push(PULSANTI_QUEST[index]);
        }
      }
      if (gestoTenuto && premuti.indexOf(gestoTenuto) !== -1) {
        // Il gesto è ancora premuto: un solo aggiornamento per gesto.
      } else if (premuti.length) {
        gestoTenuto = premuti[0];
        impostaGesto(gestoTenuto);
      } else {
        gestoTenuto = null;
      }

      if (quadLayer && (textureDirty || quadLayer.needsRedraw)) {
        paintQuad(frame);
      }
    }
  </script>
</body>
</html>
