<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Universal HUD Button</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #hud-container {
      text-align: center;
    }

    .btn-toggle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 8px solid #333;
      background-color: #330a0a;
      color: #ff4444;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .btn-toggle.state-on {
      border-color: #00ff88;
      background-color: #003311;
      color: #00ff88;
      box-shadow: 0 0 30px #00ff88;
    }

    .btn-toggle.colorato {
      border-color: var(--tinta);
      background-color: color-mix(in srgb, var(--tinta) 22%, #000);
      color: var(--tinta);
      box-shadow: 0 0 30px var(--tinta);
      font-size: 18px;
    }

    #debug-text {
      margin-top: 24px;
    }

    #quest-xr-btn {
      margin-top: 30px;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 600px) and (max-height: 600px) and (aspect-ratio: 1/1) {
      body {
        background-color: #000000;
      }
      .btn-toggle {
        width: 300px;
        height: 300px;
        font-size: 28px;
      }
      .btn-toggle.colorato {
        font-size: 22px;
      }
      #quest-xr-btn {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div id="hud-container">
    <button id="toggle-button" class="btn-toggle" type="button">OFF</button>
    <p id="debug-text">Pinch per accendere o spegnere</p>
  </div>

  <button id="quest-xr-btn">ENTRA IN MODALITÀ QUEST HUD (AR)</button>

  <script>
    const toggleButton = document.getElementById('toggle-button');
    const debugText = document.getElementById('debug-text');
    const xrButton = document.getElementById('quest-xr-btn');

    const LAYER_SIZE = 512;
    const PINCH_BUTTON = 0;
    const SINISTRA_BUTTON = 5;
    const DESTRA_BUTTON = 6;
    const COLORI = [
      { nome: 'ROSSO', hue: 0, css: '#ff2a2a' },
      { nome: 'ARANCIONE', hue: 30, css: '#ff8a00' },
      { nome: 'GIALLO', hue: 55, css: '#ffe14a' },
      { nome: 'VERDE', hue: 120, css: '#3dff6a' },
      { nome: 'AZZURRO', hue: 190, css: '#3de4ff' },
      { nome: 'BLU', hue: 240, css: '#4d6dff' },
      { nome: 'VIOLA', hue: 280, css: '#b44dff' },
      { nome: 'ROSA', hue: 330, css: '#ff4da6' }
    ];

    let audioCtx = null;
    let is_on = false;
    let coloreIndice = null;
    let pinchTenuto = false;
    let sinistraTenuta = false;
    let destraTenuta = false;
    let invioInCorso = false;
    let statoRichiesto = null;
    let invioColore = false;
    let coloreRichiesto = null;
    let quest_xr_session = null;
    let layerError = null;

    let gl = null;
    let xrGlBinding = null;
    let quadLayer = null;
    let framebuffer = null;
    let buttonTexture = null;
    let quadProgram = null;
    let quadVao = null;
    let buttonCanvas = null;
    let buttonCtx = null;
    let textureDirty = false;

    const PONTE_PUBBLICO = {
      bridge: 'https://predict-kind-congressional-prime.trycloudflare.com',
      key: 'vOSKiOKp8mDz_WNQR7o9by4R'
    };

    const ponte = leggiPonte();

    function leggiPonte() {
      const params = new URLSearchParams(location.search);
      if (params.has('bridge')) localStorage.setItem('nanoleafBridge', params.get('bridge').trim());
      if (params.has('k')) localStorage.setItem('nanoleafKey', params.get('k').trim());
      if (params.has('bridge') || params.has('k')) {
        params.delete('bridge');
        params.delete('k');
        const resto = params.toString();
        history.replaceState(null, '', location.pathname + (resto ? '?' + resto : '') + location.hash);
      }
      return {
        bridge: (localStorage.getItem('nanoleafBridge') || PONTE_PUBBLICO.bridge).replace(/\/+$/, ''),
        key: localStorage.getItem('nanoleafKey') || PONTE_PUBBLICO.key
      };
    }

    function tintaScelta() {
      if (!is_on || coloreIndice === null) return null;
      return COLORI[coloreIndice];
    }

    function indiceVicino(hue) {
      let migliore = 0;
      let distanza = 360;
      COLORI.forEach((colore, indice) => {
        let delta = Math.abs(colore.hue - hue) % 360;
        if (delta > 180) delta = 360 - delta;
        if (delta < distanza) {
          distanza = delta;
          migliore = indice;
        }
      });
      return migliore;
    }

    function applica(acceso) {
      is_on = !!acceso;
      const tinta = tintaScelta();
      toggleButton.classList.toggle('state-on', is_on && !tinta);
      toggleButton.classList.toggle('colorato', !!tinta);
      if (tinta) {
        toggleButton.style.setProperty('--tinta', tinta.css);
        toggleButton.textContent = tinta.nome;
        debugText.textContent = 'Sinistra e destra per il colore';
      } else {
        toggleButton.style.removeProperty('--tinta');
        toggleButton.textContent = is_on ? 'ON' : 'OFF';
        debugText.textContent = is_on
          ? 'Sinistra e destra per il colore'
          : 'Stato: DISATTIVATO';
      }
      if (quadLayer) {
        drawButtonCanvas();
        textureDirty = true;
      }
    }

    function luciNonRaggiunte() {
      debugText.textContent = 'Luci non raggiunte';
    }

    async function leggiStatoLuci() {
      if (!ponte.bridge) return;
      try {
        const url = ponte.bridge + '/state?k=' + encodeURIComponent(ponte.key);
        const res = await fetch(url);
        if (!res.ok) throw new Error('stato');
        const data = await res.json();
        if (data.colorMode === 'hs' && data.sat >= 50) coloreIndice = indiceVicino(data.hue);
        applica(data.on);
      } catch (err) {
        luciNonRaggiunte();
      }
    }

    function suona(acceso) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const fine = acceso ? 0.14 : 0.18;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(acceso ? 523 : 392, now);
      osc.frequency.exponentialRampToValueAtTime(acceso ? 784 : 196, now + fine);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + fine);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + fine + 0.02);
    }

    async function cambiaStato() {
      const voluto = !is_on;
      applica(voluto);
      suona(voluto);
      if (!ponte.bridge) return;
      statoRichiesto = voluto;
      if (invioInCorso) return;
      invioInCorso = true;
      try {
        while (statoRichiesto !== null) {
          const richiesto = statoRichiesto;
          statoRichiesto = null;
          try {
            const res = await fetch(ponte.bridge + '/toggle', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ on: richiesto, k: ponte.key })
            });
            if (!res.ok) throw new Error('toggle');
            const data = await res.json();
            if (statoRichiesto === null && data.on !== is_on) applica(data.on);
          } catch (err) {
            if (statoRichiesto === null) {
              applica(!richiesto);
              suona(!richiesto);
              luciNonRaggiunte();
            }
          }
        }
      } finally {
        invioInCorso = false;
      }
    }

    async function inviaColore(colore) {
      if (!ponte.bridge) return;
      coloreRichiesto = colore;
      if (invioColore) return;
      invioColore = true;
      try {
        while (coloreRichiesto) {
          const richiesto = coloreRichiesto;
          coloreRichiesto = null;
          try {
            const res = await fetch(ponte.bridge + '/color', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ hue: richiesto.hue, sat: 100, k: ponte.key })
            });
            if (!res.ok && !coloreRichiesto) luciNonRaggiunte();
          } catch (err) {
            if (!coloreRichiesto) luciNonRaggiunte();
          }
        }
      } finally {
        invioColore = false;
      }
    }

    function cambiaColore(passo) {
      if (!is_on) return;
      const totale = COLORI.length;
      coloreIndice = coloreIndice === null
        ? (passo > 0 ? 0 : totale - 1)
        : (coloreIndice + passo + totale) % totale;
      applica(true);
      inviaColore(COLORI[coloreIndice]);
    }

    toggleButton.addEventListener('click', cambiaStato);

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.target === xrButton) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        cambiaStato();
        return;
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        cambiaColore(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        cambiaColore(-1);
      }
    });

    function drawButtonCanvas() {
      const ctx = buttonCtx;
      ctx.clearRect(0, 0, LAYER_SIZE, LAYER_SIZE);
      ctx.beginPath();
      ctx.arc(256, 256, 200, 0, Math.PI * 2);
      const tinta = tintaScelta();
      const tratto = tinta ? tinta.css : (is_on ? '#00ff88' : '#ff4444');
      const canale = Number.parseInt(tratto.slice(1), 16);
      ctx.fillStyle = 'rgba('
        + (((canale >> 16) & 255) * 0.16 | 0) + ','
        + (((canale >> 8) & 255) * 0.16 | 0) + ','
        + ((canale & 255) * 0.16 | 0) + ',0.9)';
      ctx.fill();
      ctx.lineWidth = 16;
      ctx.strokeStyle = tratto;
      ctx.stroke();
      ctx.fillStyle = tratto;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const etichetta = tinta ? tinta.nome : (is_on ? 'ON' : 'OFF');
      let size = etichetta.length > 4 ? 52 : 72;
      ctx.font = 'bold ' + size + 'px sans-serif';
      while (ctx.measureText(etichetta).width > 340 && size > 32) {
        size -= 4;
        ctx.font = 'bold ' + size + 'px sans-serif';
      }
      ctx.fillText(etichetta, 256, 256);
    }

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader) || 'Shader non compilato');
      }
      return shader;
    }

    function setupQuadLayer(session) {
      buttonCanvas = document.createElement('canvas');
      buttonCanvas.width = LAYER_SIZE;
      buttonCanvas.height = LAYER_SIZE;
      buttonCtx = buttonCanvas.getContext('2d');

      const glCanvas = document.createElement('canvas');
      gl = glCanvas.getContext('webgl2', { xrCompatible: true, alpha: true });
      if (!gl) {
        throw new Error('WebGL2 non disponibile');
      }

      const vertex = compileShader(gl.VERTEX_SHADER, `#version 300 es
        layout(location = 0) in vec2 aPos;
        out vec2 vUv;
        void main() {
          vUv = aPos * 0.5 + 0.5;
          gl_Position = vec4(aPos, 0.0, 1.0);
        }`);
      const fragment = compileShader(gl.FRAGMENT_SHADER, `#version 300 es
        precision mediump float;
        uniform sampler2D uTex;
        in vec2 vUv;
        out vec4 outColor;
        void main() {
          outColor = texture(uTex, vUv);
        }`);
      quadProgram = gl.createProgram();
      gl.attachShader(quadProgram, vertex);
      gl.attachShader(quadProgram, fragment);
      gl.linkProgram(quadProgram);
      if (!gl.getProgramParameter(quadProgram, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(quadProgram) || 'Programma WebGL non linkato');
      }

      quadVao = gl.createVertexArray();
      gl.bindVertexArray(quadVao);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
        -1, -1,
        3, -1,
        -1, 3
      ]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      buttonTexture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, buttonTexture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      framebuffer = gl.createFramebuffer();

      return gl.makeXRCompatible().then(() => {
        xrGlBinding = new XRWebGLBinding(session, gl);
        return session.requestReferenceSpace('viewer');
      }).then((viewerSpace) => {
        quadLayer = xrGlBinding.createQuadLayer({
          space: viewerSpace,
          viewPixelWidth: LAYER_SIZE,
          viewPixelHeight: LAYER_SIZE,
          width: 0.1,
          height: 0.1,
          transform: new XRRigidTransform({ x: 0, y: 0, z: -1 }),
          colorFormat: gl.RGBA,
          clearOnAccess: false
        });
        session.updateRenderState({ layers: [quadLayer] });
        drawButtonCanvas();
        textureDirty = true;
      });
    }

    function paintQuad(frame) {
      const subImage = xrGlBinding.getSubImage(quadLayer, frame);
      gl.bindTexture(gl.TEXTURE_2D, buttonTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buttonCanvas);

      gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.framebufferTexture2D(
        gl.FRAMEBUFFER,
        gl.COLOR_ATTACHMENT0,
        gl.TEXTURE_2D,
        subImage.colorTexture,
        0
      );
      const viewport = subImage.viewport;
      gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
      gl.disable(gl.BLEND);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.SCISSOR_TEST);
      gl.useProgram(quadProgram);
      gl.bindVertexArray(quadVao);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, buttonTexture);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      textureDirty = false;
    }

    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (supported) {
          xrButton.style.display = 'block';
        }
      });
    }

    xrButton.addEventListener('click', () => {
      if (quest_xr_session || !navigator.xr) return;
      navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['layers'],
        optionalFeatures: ['hand-tracking']
      }).then(onXRSessionStarted).catch((err) => {
        debugText.textContent = 'Sessione Quest non avviata: ' + (err && err.message ? err.message : err);
      });
    });

    function onXRSessionStarted(session) {
      quest_xr_session = session;
      layerError = null;
      session.addEventListener('end', onXRSessionEnded);
      setupQuadLayer(session).then(() => {
        xrButton.style.display = 'none';
        debugText.textContent = 'HUD sul quad layer. Pinch accende, sinistra e destra cambiano colore.';
        session.requestAnimationFrame(onXRFrame);
      }).catch((err) => {
        layerError = 'Layer Quest non avviato: ' + (err && err.message ? err.message : err);
        debugText.textContent = layerError;
        session.end().catch(() => {});
      });
    }

    function onXRSessionEnded() {
      quest_xr_session = null;
      quadLayer = null;
      textureDirty = false;
      pinchTenuto = false;
      sinistraTenuta = false;
      destraTenuta = false;
      xrButton.style.display = 'block';
      debugText.textContent = layerError || 'Sessione Quest chiusa. Puoi rientrare.';
      layerError = null;
    }

    function onXRFrame(time, frame) {
      const session = frame.session;
      if (session !== quest_xr_session) return;
      session.requestAnimationFrame(onXRFrame);

      let pinch = false;
      let sinistra = false;
      let destra = false;
      for (const inputSource of session.inputSources) {
        const buttons = inputSource.hand && inputSource.gamepad && inputSource.gamepad.buttons;
        if (!buttons) continue;
        if (buttons[PINCH_BUTTON] && buttons[PINCH_BUTTON].pressed) pinch = true;
        if (buttons[SINISTRA_BUTTON] && buttons[SINISTRA_BUTTON].pressed) sinistra = true;
        if (buttons[DESTRA_BUTTON] && buttons[DESTRA_BUTTON].pressed) destra = true;
      }
      if (pinch && !pinchTenuto) cambiaStato();
      if (destra && !destraTenuta) cambiaColore(1);
      if (sinistra && !sinistraTenuta) cambiaColore(-1);
      pinchTenuto = pinch;
      destraTenuta = destra;
      sinistraTenuta = sinistra;

      if (quadLayer && (textureDirty || quadLayer.needsRedraw)) {
        paintQuad(frame);
      }
    }

    leggiStatoLuci();
  </script>
</body>
</html>
